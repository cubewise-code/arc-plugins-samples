<div>
   <div class="row">
      <div class="col-md-12">
         <div class="card" ng-if="data.cubesRandomized.length==0">
            <div class="card-header" style="padding: 5px 10px;">
               <div>
                  <i class="fa fa-w cubes"></i> Cubes ({{data.cubesTarget.length}})
               </div>
            </div>
            <div class="card-body">
               <div ng-repeat="item in data.cubesTarget track by $index">
                  <div>{{$index + 1}}.
                     <i class="fa fa-w cubes"></i> {{item}}
                  </div>
               </div>
            </div>
         </div>
         <div ng-if="data.cubesRandomized.length>0">
            <div class="text-center text-success">
               <i class="fa fa-user-secret" style="font-size:8em"></i>
            </div>
            <div class="alert alert-success" role="alert" style="margin-top:10px;padding: 5px 10px">
               cubes data randomized check folder '{{data.targetFolder}}' for .cub files
            </div>
         </div>
      </div>
   </div>
</div>
