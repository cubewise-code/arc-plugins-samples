<div>
   <div class="row">
      <div class="col-md-12">
         <span>
            Process Feeders for the following cubes:
         </span>
         <ul>
            <li ng-repeat="cube in data.cubes">{{cube.Name}}
               <span ng-if="cube.responseTimeMs>0" class="badge ml-1 badge-success" ng-style="generateHSLColour(cube.responseTimeMs)">
                  {{cube.responseTimeMs}} Ms
               </span>
               <span ng-if="cube.failed" class="badge ml-1 badge-danger">Failed</span>
            </li>
         </ul>
      </div>
   </div>
   <div class="row" ng-if="data.responseTimeMs>0" style="margin-top:10px">
      <div class="col-md-12">
         <div class="alert alert-success" role="alert">
            <i class="fa fa-check-circle" aria-hidden="true"></i> Process feeders for all cubes in {{data.responseTimeMs}} Ms
         </div>
      </div>
   </div>
</div>
